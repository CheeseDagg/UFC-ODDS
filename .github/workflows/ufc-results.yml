name: UFC results update
# Pulls completed cards from ESPN's public UFC endpoint since the stored
# through-date, appends to data/results_delta.csv, and rebuilds the site.
# (Source moved off ufcstats.com 2026-07-17: it now serves a JS bot-check that
# urllib cannot pass, which silently returned zero events.)
# Sun+Mon 12:00 UTC catches Saturday cards.
on:
  schedule:
    - cron: "0 12 * * 0,1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install pandas          # build_widget.py needs it; the job never
                                         # got this far before, so it went unnoticed
      - name: Pull new results from ESPN
        working-directory: Github
        run: |
          python ufc_results_update.py --selftest
          python ufc_results_update.py
      - name: Rebuild site with current records
        working-directory: Github
        run: python build_site.py --local
      - name: Blend grade (fail-soft)
        working-directory: Github
        run: python ufc_blend_predict.py --grade-only || true
      - name: Commit
        run: |
          git config user.name ufc-bot
          git config user.email ufc-bot@users.noreply.github.com
          for p in Github/data/results_delta.csv Github/data/results_through.txt Github/docs Github/output Github/data/ufc_predictions_blend.csv Github/data/ufc_graded_blend.csv Github/output/blend_ab.json; do
            git add "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "results update + rebuild"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && { echo "pushed"; exit 0; }
            echo "push race - retry $i"; sleep 3
          done
          echo "push failed after 5 retries"; exit 1
