name: UFC DOB backfill
# Widen fighter_meta_cache.json. The DOB cache covers 48.6% of bouts on both
# corners, and age is the biggest validated UFC finding, so every experiment
# from here runs against a half-strength age control until this is fixed.
# Wikidata, ESPN and ufcstats are all blocked from the dev sandbox, so this has
# to run here. Fire by touching experiments/RUN-DOB.txt.
#
# WHY THIS FILE REPORTS ITS OWN OUTCOME. Round 2 (the ufcstats source) fired
# and nothing ever landed on main. From the dev sandbox that is indistinguishable
# from three different things: the job failed, the job succeeded and found no new
# DOBs, or the job never started. api.github.com is blocked from the sandbox
# (502 through the proxy), so a commit is the ONLY channel back. A run that can
# fail silently is a run that costs a round trip to diagnose, so every step now
# captures its own log, no step can abort the job before the reporting step, and
# the status file is committed with `if: always()` — including on failure.
on:
  push:
    paths: ['experiments/RUN-DOB.txt']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ufc-dob
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Every worker step is continue-on-error and tees to logs/. Nothing here
      # is allowed to kill the job, because the job's most valuable output when
      # something breaks is the reason it broke.
      - name: Selftest (normalizer, plausibility gate, no-overwrite)
        id: selftest
        continue-on-error: true
        working-directory: Github
        run: |
          mkdir -p ../logs
          python ufc_dob_backfill.py --selftest 2>&1 | tee ../logs/selftest.txt

      - name: Coverage before
        id: before
        continue-on-error: true
        working-directory: Github
        run: |
          mkdir -p ../logs
          python ufc_dob_backfill.py --report 2>&1 | tee ../logs/before.txt

      - name: Backfill (ufcstats, then Wikidata, then ESPN search)
        id: backfill
        continue-on-error: true
        # STEP timeout, not just a job timeout. This is the leading suspect for
        # why round 2 vanished: ~1,271 ufcstats requests plus 700 ESPN searches
        # plus the angles-2 re-run can exceed the 75-minute JOB budget, and a
        # job timeout is a cancellation — the commit step never runs and the
        # whole hour is thrown away with nothing to show. A STEP timeout fails
        # only this step, continue-on-error swallows it, and the status file
        # still lands saying exactly that.
        timeout-minutes: 38
        working-directory: Github
        env:
          ESPN_MAX: "300"
          # Round 7 filled DOBs to 97.2% and picked up 1,102 stances on the
          # way — but only for fighters it had a reason to fetch, which was
          # the set MISSING a DOB: the obscure and the long-retired. Holdout
          # stance coverage came out at 1.0%, i.e. 18 bouts, which is no panel
          # at all. This sweep visits the ~1,280 men active since 2015 who have
          # a DOB and no stance, which is the population a southpaw angle would
          # actually be decided on.
          STANCE_SINCE: "2015-01-01"
        run: |
          mkdir -p ../logs
          python ufc_dob_backfill.py 2>&1 | tail -c 60000 | tee ../logs/backfill.txt

      - name: Coverage after
        id: after
        continue-on-error: true
        working-directory: Github
        run: |
          mkdir -p ../logs
          python ufc_dob_backfill.py --report 2>&1 | tee ../logs/after.txt

      - name: Re-run the wear-and-tear batch against the widened age control
        id: angles
        continue-on-error: true
        working-directory: Github
        # The whole point of the pull. Four angles were buried on a 47%
        # age-complete subset of 1,486 holdout bouts. If coverage moves, the
        # decisive test gets materially more power and the verdicts deserve
        # a re-read - in either direction.
        env:
          VERDICT_OUT: ../experiments/UFC-ANGLES2-VERDICT-WIDENED.md
        run: |
          mkdir -p ../logs
          python ufc_angles2_experiment.py 2>&1 | tail -c 40000 | tee ../logs/angles.txt

      - name: Stance coverage after the sweep
        id: stance
        if: always()
        continue-on-error: true
        working-directory: Github
        # Coverage on the HOLDOUT is the only number that decides whether a
        # stance angle is testable. Overall coverage is not a substitute:
        # after round 7 it read 12.9% overall and 1.0% on the holdout, and the
        # first of those two numbers is the one that would have been reported.
        run: |
          mkdir -p ../logs
          python - <<'PY' 2>&1 | tee ../logs/stance.txt
          import json, csv, re
          def norm(n):
              n = (n or "").strip().lower().replace(".", "").replace("'", "")
              return re.sub(r"\s+", " ", n.replace("-", " "))
          M = {norm(k): v for k, v in json.load(
              open("fighter_meta_cache.json")).items()}
          rows = list(csv.DictReader(open("data/fighter_bouts.csv")))
          seen, bouts = set(), []
          for r in rows:
              k = (r["date"],) + tuple(sorted([r["fighter"], r["opp"]]))
              if k in seen or r["won"] not in ("0", "1"):
                  continue
              seen.add(k); bouts.append(r)
          def ok(n):
              v = M.get(norm(n)); return bool(v and v.get("stance"))
          for tag, bs in (("ALL", bouts),
                          ("HOLDOUT", [b for b in bouts
                                       if b["date"] >= "2023-01-01"])):
              both = sum(1 for b in bs if ok(b["fighter"]) and ok(b["opp"]))
              print(f"{tag}: both stances known {both}/{len(bs)} "
                    f"({100.0 * both / max(len(bs), 1):.1f}%)")
          from collections import Counter
          print(Counter(v.get("stance") for v in M.values() if v.get("stance")))
          PY

      - name: Reach angles (batch 4)
        id: angles4
        continue-on-error: true
        timeout-minutes: 12
        working-directory: Github
        env:
          VERDICT_OUT: ../experiments/UFC-ANGLES4-VERDICT.md
        run: |
          mkdir -p ../logs
          python ufc_angles4_experiment.py --selftest 2>&1 | tee ../logs/angles4.txt
          python ufc_angles4_experiment.py 2>&1 | tail -c 40000 | tee -a ../logs/angles4.txt

      - name: Stance angles (batch 5)
        id: angles5
        continue-on-error: true
        timeout-minutes: 16
        working-directory: Github
        # Runs LAST because it is the only batch that could not run at all
        # before this workflow existed: holdout stance coverage was 1.0% (18
        # bouts) until the round-8 sweep took it to 91.8%.
        env:
          VERDICT_OUT: ../experiments/UFC-ANGLES5-VERDICT.md
        run: |
          mkdir -p ../logs
          python ufc_angles5_experiment.py --selftest 2>&1 | tee ../logs/angles5.txt
          python ufc_angles5_experiment.py 2>&1 | tail -c 40000 | tee -a ../logs/angles5.txt

      - name: Write run status
        if: always()
        run: |
          mkdir -p experiments logs
          {
            echo "# DOB backfill run status"
            echo ""
            echo "run    $GITHUB_RUN_ID  attempt $GITHUB_RUN_NUMBER"
            echo "sha    $GITHUB_SHA"
            echo "when   $(date -u +%FT%TZ)"
            echo ""
            echo "step outcomes (failure here is the whole point of this file):"
            echo "  selftest  ${{ steps.selftest.outcome }}"
            echo "  before    ${{ steps.before.outcome }}"
            echo "  backfill  ${{ steps.backfill.outcome }}"
            echo "  after     ${{ steps.after.outcome }}"
            echo "  angles    ${{ steps.angles.outcome }}"
            echo "  stance    ${{ steps.stance.outcome }}"
            echo "  angles4   ${{ steps.angles4.outcome }}"
            echo "  angles5   ${{ steps.angles5.outcome }}"
            echo ""
            echo "coverage BEFORE:"; sed 's/^/  /' logs/before.txt 2>/dev/null || echo "  (step did not run)"
            echo "coverage AFTER:";  sed 's/^/  /' logs/after.txt  2>/dev/null || echo "  (step did not run)"
            echo ""
            # Stance coverage goes in FULL, not tailed. It is four lines, and it
            # is the number that decides whether the southpaw angle is testable
            # at all — truncating it to save space would defeat the sweep.
            echo "--- stance coverage ---"
            cat logs/stance.txt 2>/dev/null || echo "(no stance log)"
            echo ""
            echo "--- backfill tail (last 200 lines) ---"
            tail -n 200 logs/backfill.txt 2>/dev/null || echo "(no backfill log — the step never produced output)"
            echo ""
            echo "--- angles tail (last 40 lines) ---"
            tail -n 40 logs/angles.txt 2>/dev/null || echo "(no angles log)"
            echo ""
            # 120 lines, not 40: batch 4 prints a five-angle ladder with a
            # ceiling probe per angle across TWO passes, and the second pass
            # (raw reach in the baseline) is the one that decides. A 40-line
            # tail would cut off exactly the half that matters.
            echo "--- reach angles (batch 4) tail (last 120 lines) ---"
            tail -n 120 logs/angles4.txt 2>/dev/null || echo "(no angles4 log)"
            echo ""
            # Same reasoning as batch 4: six angles x two passes, and the
            # ceiling lines are the half that decides. 140 lines because batch
            # 5 also prints a walk-down line per absorbed plant strength.
            echo "--- stance angles (batch 5) tail (last 140 lines) ---"
            tail -n 140 logs/angles5.txt 2>/dev/null || echo "(no angles5 log)"
          } > experiments/DOB-RUN-STATUS.md
          cat experiments/DOB-RUN-STATUS.md

      - name: Commit widened cache + refreshed verdict + status
        if: always()
        run: |
          git config user.name ufc-bot
          git config user.email actions@github.com
          # DOB-RUN-STATUS.md changes every run (run id, timestamp), so this
          # commit lands whether or not the backfill found anything. That is
          # deliberate: "no new DOBs" and "the scraper 403'd" must not look the
          # same from a machine that can only read main.
          for f in Github/fighter_meta_cache.json \
                   experiments/UFC-ANGLES2-VERDICT-WIDENED.md \
                   experiments/UFC-ANGLES4-VERDICT.md \
                   experiments/UFC-ANGLES5-VERDICT.md \
                   experiments/DOB-RUN-STATUS.md; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "UFC DOB backfill run $(date -u +%F): status + any widened cache"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race - retry $i"; sleep 3
          done
          exit 1
